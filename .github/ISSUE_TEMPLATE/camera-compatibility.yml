name: Camera compatibility report
description: Report a successful or unsuccessful hardware test
title: "[Camera] "
labels: [camera-compatibility]
body:
  - type: markdown
    attributes:
      value: Do not include camera serial numbers, Wi-Fi passwords, photographs, or unredacted packet captures.
  - type: input
    id: camera
    attributes:
      label: Camera model
      placeholder: Nikon Zf, firmware 3.00
    validations:
      required: true
  - type: dropdown
    id: wifi
    attributes:
      label: Connection method
      options:
        - Wi-Fi AP
        - Wi-Fi STA
        - Bluetooth experiment
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Privacy-checked compatibility report
      description: Paste the app's compatibility report after checking device identifiers and local network details.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: tests
    attributes:
      label: Tests completed
      options:
        - label: Catalog loaded
        - label: JPEG thumbnails displayed
        - label: JPEG original downloaded and opened externally
        - label: RAW original downloaded
        - label: Video original downloaded
        - label: Reconnected after disabling and re-enabling camera Wi-Fi
  - type: textarea
    id: notes
    attributes:
      label: Errors or additional notes
