name: Bug report
description: Report a reproducible app problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Zf 传图版本
      placeholder: 0.3.5-zf-lab
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Phone and Android version
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model
      placeholder: Nikon Zf, firmware 3.00
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Wi-Fi AP
        - Wi-Fi STA
        - Bluetooth experiment
        - Offline gallery or settings
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error text
    validations:
      required: true
